<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechShop - Προϊόντα</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo"><i class="fas fa-laptop-code"></i> TechShop</div>
            <div class="menu-toggle"><i class="fas fa-bars"></i></div>
            <div class="nav-links">
                <a href="/">Αρχική</a>
                <a href="/products">Προϊόντα</a>
                <a href="#">Επικοινωνία</a>
            </div>
        </nav>
    </header>

    <main class="products-page">
        <section class="search-section">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Αναζήτηση προϊόντων...">
                <button id="search-button"><i class="fas fa-search"></i></button>
            </div>
        </section>

        <section class="products-section">
            <div class="products-container" id="products-list">
                <!-- Προϊόντα θα προστεθούν δυναμικά μέσω JavaScript -->
                <div class="loading-message">Φόρτωση προϊόντων...</div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-col">
                <h3>TechShop</h3>
                <p>Οι καλύτερες τιμές σε ηλεκτρονικές συσκευές</p>
            </div>
            <div class="footer-col">
                <h3>Επικοινωνία</h3>
                <p><i class="fas fa-map-marker-alt"></i> CSD Auth, Θεσσαλονίκη</p>
                <p><i class="fas fa-envelope"></i> info@techshop.gr</p>
            </div>
        </div>
        <div class="copyright">
            <p>&copy; 2025 TechShop | Developed by Papadopoulou Ourania, Bouzouki Polyxeni, Chrysostomos Koubanis, Konstantinos Trygoutis</p>
        </div>
    </footer>

    <script src="products.js"></script>
    <script>
        // Mobile Menu
        document.querySelector('.menu-toggle').addEventListener('click', () => {
            document.querySelector('.nav-links').classList.toggle('active');
        });
    </script>
</body>
</html>
